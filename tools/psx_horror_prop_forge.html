<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Interactive Three.js forge for detailed PSX school-horror props." />
  <title>UCB Inday — Prop Forge</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #dce7cf;
      --muted: #84917f;
      --phosphor: #b7e870;
      --danger: #ff604c;
      --night: #080b0b;
      --panel: rgba(11, 15, 14, .91);
      --line: rgba(183, 232, 112, .2);
      font-family: "Courier New", "Lucida Console", monospace;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--ink); }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0, rgba(255,255,255,.025) 1px, transparent 1px, transparent 4px);
      mix-blend-mode: overlay;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 48%, rgba(0,0,0,.56) 100%);
    }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    button { font: inherit; }
    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: grid;
      grid-template-columns: minmax(270px, 320px) 1fr minmax(260px, 300px);
      grid-template-rows: auto 1fr auto;
      gap: 18px;
      padding: 18px;
    }
    .panel {
      pointer-events: auto;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 16px 45px rgba(0,0,0,.45), inset 0 0 30px rgba(183,232,112,.025);
      backdrop-filter: blur(10px);
    }
    .brand {
      grid-column: 1;
      grid-row: 1;
      padding: 18px;
      border-top: 3px solid var(--phosphor);
    }
    .brand-kicker, .eyebrow {
      margin: 0 0 8px;
      color: var(--phosphor);
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 { max-width: 11ch; margin: 0; font-size: clamp(25px, 3vw, 42px); line-height: .88; letter-spacing: -.07em; text-transform: uppercase; }
    .brand p:last-child { margin: 12px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .dossier {
      grid-column: 3;
      grid-row: 1 / span 2;
      align-self: start;
      padding: 16px;
      border-right: 3px solid var(--phosphor);
    }
    .serial { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 10px; }
    .live { display: inline-flex; align-items: center; gap: 6px; color: var(--phosphor); }
    .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 12px currentColor; animation: blink 1.1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .22; } }
    .asset-number { margin: 22px 0 0; color: rgba(183,232,112,.2); font-size: 54px; line-height: .8; letter-spacing: -.08em; }
    .dossier h2 { margin: 7px 0 8px; font-size: 23px; text-transform: uppercase; letter-spacing: -.04em; }
    .dossier-copy { min-height: 66px; margin: 0 0 15px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .specs { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; border: 1px solid var(--line); background: var(--line); }
    .spec { min-height: 53px; padding: 9px; background: #0c100f; }
    .spec span { display: block; color: var(--muted); font-size: 8px; text-transform: uppercase; letter-spacing: .14em; }
    .spec strong { display: block; margin-top: 5px; color: var(--ink); font-size: 10px; font-weight: normal; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 12px; }
    .controls button, .export {
      min-height: 36px;
      border: 1px solid var(--line);
      background: #111815;
      color: var(--ink);
      cursor: pointer;
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: .08em;
      transition: .15s ease;
    }
    .controls button:hover, .controls button.active, .export:hover { border-color: var(--phosphor); color: var(--phosphor); background: rgba(183,232,112,.08); }
    .controls button:focus-visible, .export:focus-visible, .asset-card:focus-visible { outline: 2px solid var(--phosphor); outline-offset: 2px; }
    .export { width: 100%; margin-top: 7px; background: var(--phosphor); border-color: var(--phosphor); color: #10150d; font-weight: bold; }
    .export:hover { color: #10150d; background: #cff68d; }
    .asset-tray {
      grid-column: 1 / -1;
      grid-row: 3;
      display: grid;
      grid-template-columns: repeat(12, minmax(76px, 1fr));
      gap: 1px;
      padding: 1px;
      background: var(--line);
    }
    .asset-card {
      position: relative;
      min-height: 72px;
      padding: 10px 8px 8px;
      border: 0;
      background: rgba(9,13,12,.96);
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      text-transform: uppercase;
      transition: .15s ease;
    }
    .asset-card:hover { background: #131b17; color: var(--ink); }
    .asset-card.active { background: var(--phosphor); color: #10150d; }
    .asset-card b { display: block; font-size: 9px; line-height: 1.1; }
    .asset-card small { display: block; margin-top: 9px; font-size: 8px; opacity: .66; }
    .asset-card i { position: absolute; top: 8px; right: 8px; font-size: 8px; font-style: normal; opacity: .5; }
    .hint {
      position: fixed;
      left: 50%;
      top: 20px;
      z-index: 10;
      transform: translateX(-50%);
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(0,0,0,.38);
      color: rgba(220,231,207,.55);
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .danger .dossier { border-color: var(--danger); }
    .danger .live, .danger .eyebrow { color: var(--danger); }
    @media (max-width: 980px) {
      .hud { grid-template-columns: 1fr 250px; grid-template-rows: auto 1fr auto; padding: 10px; gap: 10px; }
      .brand { grid-column: 1; }
      .dossier { grid-column: 2; }
      .asset-tray { grid-template-columns: repeat(6, 1fr); }
      .asset-card { min-height: 52px; }
      .asset-card small { display: none; }
    }
    @media (max-width: 650px) {
      .hud { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
      .brand { padding: 12px; }
      .brand p:last-child { display: none; }
      h1 { font-size: 26px; }
      .dossier { grid-column: 1; grid-row: 2; width: min(240px, 70vw); align-self: end; padding: 10px; }
      .asset-number, .dossier-copy, .specs { display: none; }
      .dossier h2 { font-size: 17px; margin: 4px 0 8px; }
      .asset-tray { grid-template-columns: repeat(4, 1fr); max-height: 170px; overflow-y: auto; }
      .asset-card { min-height: 45px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="hint">drag: inspect / wheel: zoom / keys 1–9: select</div>
  <main class="hud">
    <section class="panel brand" aria-label="Tool title">
      <p class="brand-kicker">UCB Inday // Asset workshop</p>
      <h1>Night Shift Prop Forge</h1>
      <p>Detailed low-poly assemblies for the phone, survival, corridor, evidence, and escape systems.</p>
    </section>

    <aside class="panel dossier" aria-live="polite">
      <div class="serial"><span>UCB-PROP/<span id="serial">001</span></span><span class="live">MODEL LIVE</span></div>
      <div class="asset-number" id="assetNumber">01</div>
      <p class="eyebrow" id="category">Communication</p>
      <h2 id="assetName">Nokia 3310</h2>
      <p class="dossier-copy" id="description"></p>
      <div class="specs">
        <div class="spec"><span>Triangles</span><strong id="triangles">—</strong></div>
        <div class="spec"><span>Parts</span><strong id="parts">—</strong></div>
        <div class="spec"><span>Scale</span><strong id="scale">Hand prop</strong></div>
        <div class="spec"><span>State</span><strong id="stateLabel">Idle</strong></div>
      </div>
      <div class="controls">
        <button id="stateButton">Trigger state</button>
        <button id="explodeButton">Explode view</button>
        <button id="wireButton">Wireframe</button>
        <button id="spinButton" class="active">Auto rotate</button>
      </div>
      <button class="export" id="exportButton">Export selected .GLB</button>
    </aside>

    <nav class="panel asset-tray" id="assetTray" aria-label="Prop selection"></nav>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080b0b);
    scene.fog = new THREE.FogExp2(0x080b0b, 0.036);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.05, 120);
    camera.position.set(6.5, 4.2, 8.5);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance", preserveDrawingBuffer: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.BasicShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = .78;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.25, 0);
    controls.minDistance = 3.2;
    controls.maxDistance = 15;
    controls.maxPolarAngle = Math.PI * .52;

    const hemi = new THREE.HemisphereLight(0xbad2b5, 0x11110d, 1.4);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xd8f3b0, 4.4);
    key.position.set(4, 8, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    scene.add(key);
    const rim = new THREE.PointLight(0x426bff, 24, 18, 2);
    rim.position.set(-5, 3, -4);
    scene.add(rim);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(5.8, 32),
      new THREE.MeshStandardMaterial({ color: 0x151a16, roughness: .94, metalness: .03 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(5.82, 5.87, 64),
      new THREE.MeshBasicMaterial({ color: 0x6a8d4e, transparent: true, opacity: .4 })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = .005;
    scene.add(ring);

    const grid = new THREE.GridHelper(11, 22, 0x293624, 0x151d16);
    grid.position.y = .012;
    scene.add(grid);

    const M = {
      nokia: mat(0x39443a, .85),
      nokiaDark: mat(0x161d19, .8),
      screen: new THREE.MeshStandardMaterial({ color: 0x789155, emissive: 0x425f27, emissiveIntensity: 1.2, roughness: .65 }),
      cream: mat(0xd3c6a4, .9),
      plastic: mat(0x242b27, .72),
      black: mat(0x090b0a, .8),
      metal: mat(0x636963, .35, .6),
      rust: mat(0x744535, .78, .08),
      wood: mat(0x6c4829, .92),
      schoolBlue: mat(0x1f4771, .8),
      locker: mat(0x48615d, .72, .25),
      paper: mat(0xd8d0b5, .98),
      red: mat(0x8f2b29, .8),
      vhs: mat(0x191a1a, .78),
      glass: new THREE.MeshStandardMaterial({ color: 0x617976, roughness: .28, metalness: .04, transparent: true, opacity: .64 }),
      glow: new THREE.MeshBasicMaterial({ color: 0xb7e870, toneMapped: false }),
      creature: mat(0x1a1715, .96),
      skin: mat(0x6b6256, .94)
    };

    function mat(color, roughness = .82, metalness = 0) {
      return new THREE.MeshStandardMaterial({ color, roughness, metalness, flatShading: true });
    }
    function add(parent, geometry, material, position = [0,0,0], rotation = [0,0,0], name = "part") {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(...position);
      mesh.rotation.set(...rotation);
      mesh.name = name;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData.home = mesh.position.clone();
      parent.add(mesh);
      return mesh;
    }
    function box(parent, size, material, position, rotation, name, radius = 0) {
      const geometry = radius > 0 ? new RoundedBoxGeometry(size[0], size[1], size[2], 2, radius) : new THREE.BoxGeometry(...size);
      return add(parent, geometry, material, position, rotation, name);
    }
    function cyl(parent, radii, material, position, rotation, name, segments = 10) {
      return add(parent, new THREE.CylinderGeometry(radii[0], radii[1], radii[2], segments), material, position, rotation, name);
    }
    function labelTexture(text, bg = "#98aa70", fg = "#172011", sub = "") {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 128;
      const x = c.getContext("2d");
      x.fillStyle = bg; x.fillRect(0,0,c.width,c.height);
      x.fillStyle = fg;
      x.font = "bold 30px monospace";
      x.textAlign = "center";
      x.fillText(text, 128, 58);
      if (sub) { x.font = "18px monospace"; x.fillText(sub, 128, 91); }
      const texture = new THREE.CanvasTexture(c);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      return texture;
    }
    function screenMaterial(text, sub = "") {
      return new THREE.MeshStandardMaterial({ map: labelTexture(text, "#91a768", "#172011", sub), emissive: 0x395321, emissiveIntensity: .75, roughness: .7 });
    }
    function root(name) {
      const g = new THREE.Group();
      g.name = name;
      return g;
    }
    function remember(group) {
      group.traverse((o) => { if (o.isMesh && !o.userData.home) o.userData.home = o.position.clone(); });
      return group;
    }

    function makePhone() {
      const g = root("Nokia_3310_Phone");
      box(g, [1.18, 2.42, .42], M.nokia, [0,1.3,0], [0,0,0], "phone_shell", .2);
      box(g, [.92, .66, .05], screenMaterial("1 NEW SMS", "DON'T USE LIFT"), [0,1.78,.235], [0,0,0], "lcd_screen", .035);
      box(g, [.58,.08,.04], M.black, [0,2.23,.23], [0,0,0], "speaker");
      for (let i=0;i<5;i++) cyl(g,[.025,.025,.03],M.metal,[-.19+i*.095,2.23,.27],[Math.PI/2,0,0],`speaker_hole_${i}`,6);
      const keys = [["L",-0.32,1.26],["OK",0,1.30],["R",.32,1.26]];
      keys.forEach(([n,x,y])=>box(g,[.25,.16,.06],M.cream,[x,y,.25],[0,0,0],`key_${n}`,.05));
      const chars = ["1","2","3","4","5","6","7","8","9","*","0","#"];
      chars.forEach((n,i)=>{
        const x=(i%3-1)*.31, y=1.00-Math.floor(i/3)*.25;
        cyl(g,[.115,.12,.065],i===4?M.glow:M.cream,[x,y,.26],[Math.PI/2,0,0],`key_${n}`,8);
      });
      box(g,[.35,.18,.2],M.nokiaDark,[0,2.58,-.03],[0,0,0],"antenna",.06);
      const bulb=cyl(g,[.06,.06,.08],M.glow,[.25,2.55,.02],[Math.PI/2,0,0],"phone_torch",8);
      const light=new THREE.SpotLight(0xb7e870,0,9,.52,.45,1.4);
      light.position.set(.25,2.55,.22); light.target.position.set(.25,1.4,4);
      g.add(light,light.target);
      g.userData.state={label:"Phone light", active:false, update(active){ light.intensity=active?28:0; bulb.material=active?M.glow:M.cream; }};
      return remember(g);
    }

    function makeFlashlight() {
      const g=root("Limited_Battery_Flashlight");
      const body=cyl(g,[.42,.34,1.55],M.plastic,[0,1.25,0],[0,0,Math.PI/2],"flashlight_body",12);
      cyl(g,[.64,.42,.42],M.metal,[.97,1.25,0],[0,0,Math.PI/2],"reflector_head",12);
      cyl(g,[.55,.55,.06],M.glass,[1.2,1.25,0],[0,0,Math.PI/2],"lens",16);
      for(let i=0;i<5;i++) cyl(g,[.355,.355,.055],M.nokiaDark,[-.55+i*.25,1.25,0],[0,0,Math.PI/2],`grip_ring_${i}`,10);
      box(g,[.28,.12,.18],M.red,[.05,1.64,0],[0,0,0],"switch",.04);
      const cone=new THREE.SpotLight(0xf3efcf,0,15,.34,.25,1.6);
      cone.position.set(1.22,1.25,0); cone.target.position.set(7,1.25,0); g.add(cone,cone.target);
      const cells=[];
      [-.45,.1].forEach((x,i)=>cells.push(cyl(g,[.22,.22,.7],mat(i?0xb89b32:0x9b382f,.6,.15),[x,.45,0],[0,0,Math.PI/2],`battery_${i+1}`,10)));
      g.userData.state={label:"Flicker: 09%",active:false,update(active,t=0){ cone.intensity=active?(Math.sin(t*31)>-.45?80:8):0; cells.forEach((c,i)=>c.visible=!active||Math.sin(t*3+i)>-.5); }};
      return remember(g);
    }

    function makeNoiseLure() {
      const g=root("Noise_Decoy_Radio");
      box(g,[1.75,1.18,.68],M.plastic,[0,1.05,0],[0,0,0],"radio_case",.09);
      box(g,[.94,.68,.04],M.black,[-.28,1.08,.37],[0,0,0],"speaker_grille");
      for(let x=-.62;x<.12;x+=.15) for(let y=.8;y<1.4;y+=.15) cyl(g,[.035,.035,.025],M.metal,[x,y,.405],[Math.PI/2,0,0],"grille_hole",6);
      cyl(g,[.17,.17,.12],M.cream,[.55,1.28,.4],[Math.PI/2,0,0],"tuning_knob",10);
      cyl(g,[.13,.13,.12],M.red,[.55,.88,.4],[Math.PI/2,0,0],"noise_button",10);
      cyl(g,[.025,.025,1.4],M.metal,[.62,2.05,-.12],[0,0,-.25],"antenna",6);
      const waves=[];
      [1,1.35,1.7].forEach((r,i)=>{
        const w=add(g,new THREE.TorusGeometry(r,.025,4,20,Math.PI*1.35),M.glow,[0,1.15,.1],[Math.PI/2,0,-Math.PI*.68],"sound_wave");
        w.visible=false; waves.push(w);
      });
      g.userData.state={label:"Noise: loud",active:false,update(active,t=0){ waves.forEach((w,i)=>{w.visible=active;w.scale.setScalar(.75+((t*1.5+i*.24)%1)*.35);w.material.opacity=1-((t*1.5+i*.24)%1);}); }};
      return remember(g);
    }

    function makeDoor() {
      const g=root("Classroom_Door_Barricade");
      box(g,[2.5,.18,.25],M.schoolBlue,[0,2.55,0],[0,0,0],"door_frame_top");
      box(g,[.18,5,.25],M.schoolBlue,[-1.18,0,0],[0,0,0],"door_frame_left");
      box(g,[.18,5,.25],M.schoolBlue,[1.18,0,0],[0,0,0],"door_frame_right");
      const pivot=new THREE.Group(); pivot.name="door_hinge"; pivot.position.set(-1.02,0,0); g.add(pivot);
      box(pivot,[2.0,4.75,.16],M.wood,[1.02,2.38,0],[0,0,0],"door_leaf");
      box(pivot,[1.48,1.15,.08],M.glass,[1.02,3.72,.1],[0,0,0],"jalousie_glass");
      for(let i=0;i<7;i++) box(pivot,[1.5,.055,.18],M.metal,[1.02,3.25+i*.17,.14],[.22,0,0],`jalousie_slat_${i}`);
      cyl(pivot,[.09,.09,.16],M.metal,[1.72,2.25,.15],[Math.PI/2,0,0],"doorknob",10);
      const brace=box(g,[2.75,.22,.18],M.wood,[0,2.05,.35],[0,0,.12],"barricade_plank");
      const keyMesh=add(g,new THREE.TorusGeometry(.16,.045,6,12,Math.PI*1.65),M.metal,[.68,.55,.22],[0,0,.2],"room_key");
      box(g,[.42,.09,.06],M.metal,[.84,.45,.22],[0,0,-.4],"key_teeth");
      g.userData.state={label:"Barricade: 10s",active:false,update(active,t=0){pivot.rotation.y=active?-1.08:0;brace.rotation.z=active?.72+.04*Math.sin(t*22):.12;keyMesh.rotation.z=t*2;}};
      return remember(g);
    }

    function makeTaskBoard() {
      const g=root("Errand_Task_Board");
      box(g,[3.5,2.5,.18],M.wood,[0,1.65,0],[0,0,0],"wood_frame",.06);
      box(g,[3.08,2.08,.12],mat(0x7b6548,.98),[0,1.65,.12],[0,0,0],"cork_board");
      const notes=[
        [-.92,2.05,.12,-.07,0xd8d0b5], [.15,2.25,-.05,.05,0xd6c36a], [.95,1.87,.08,.02,0xc2d7cf],
        [-.58,1.18,-.04,.06,0xc9c0aa], [.55,1.08,.09,-.08,0xd9c6ba]
      ];
      notes.forEach((n,i)=>{
        box(g,[.72,.62,.025],mat(n[4],.95),[n[0],n[1],.23],[0,0,n[3]],`task_note_${i+1}`);
        cyl(g,[.045,.045,.035],i===2?M.red:M.glow,[n[0],n[1]+.22,.27],[Math.PI/2,0,0],"thumbtack",6);
      });
      box(g,[.5,.18,.12],M.black,[-1.03,.62,.32],[0,0,.1],"usb_drive");
      box(g,[.18,.13,.07],M.metal,[-.7,.67,.32],[0,0,.1],"usb_plug");

    const assets = [
      { name:"Nokia 3310", short:"Phone", category:"Communication", scale:"Hand prop", description:"Curved shell, emissive monochrome LCD, speaker perforations, antenna, full keypad, and a weak phone-light state.", make:makePhone },
      { name:"Battery Torch", short:"Torch", category:"Survival light", scale:"Hand prop", description:"Faceted reflector, lens, switch, grip rings, removable cells, real spotlight cone, and a low-battery flicker preview.", make:makeFlashlight },
      { name:"Noise Decoy", short:"Decoy", category:"Sound system", scale:"Carry prop", description:"Portable corridor radio with speaker grille, tuning controls, antenna, and animated sound-wave lure state.", make:makeNoiseLure },
      { name:"Door Module", short:"Door", category:"Barricade", scale:"Architecture", description:"Hinged classroom door with frame, handle, transparent jalousie window, individual louvers, key, and breakable plank.", make:makeDoor },
      { name:"Errand Board", short:"Tasks", category:"Objectives", scale:"Wall prop", description:"Framed cork board with layered notes, thumbtacks, registrar stamp, library book, and the forgotten USB.", make:makeTaskBoard },
      { name:"CRT + VHS", short:"VHS", category:"Collectible lore", scale:"Furniture", description:"Faculty-lounge CRT with dials, speaker holes, curved screen treatment, labeled VHS tape, reels, and playback glow.", make:makeCRT },
      { name:"Sanity Kit", short:"Sanity", category:"Safe zone", scale:"Carry props", description:"Emergency phosphor lantern and first-aid tin for lit-area recovery beats and visual safe-zone language.", make:makeSanityKit },
      { name:"The Watcher", short:"Creature", category:"Threat", scale:"Character", description:"Asymmetrical low-poly corridor creature with elongated jointed limbs, separate fingers, angular head, and glowing eyes.", make:makeCreature },
      { name:"Elevator Risk", short:"Elevator", category:"Escape route", scale:"Architecture", description:"Sliding lift doors, inset seam, call panel, dual buttons, and a wrong-floor display for tense arrival events.", make:makeElevator },
      { name:"Sign-in Log", short:"Logbook", category:"Evidence", scale:"Desk prop", description:"Open guard-post register with ruled pages, impossible red entry, pen, clip, desk slab, and page-distortion state.", make:makeLogbook },
      { name:"Player Locker", short:"Locker", category:"Inventory", scale:"Furniture", description:"Opening vented steel locker with hinges, lock, shelves, bag, and four distinct inventory-slot props inside.", make:makeLocker },
      { name:"Pickup Set", short:"Pickups", category:"Resources", scale:"Item set", description:"Modeled D-cell battery, two-prong Nokia charger with curved cable, plug, keyring, and color-coded floor keys.", make:makePickups }
    ];

    const tray=document.querySelector("#assetTray");
    assets.forEach((asset,i)=>{
      const b=document.createElement("button");
      b.className="asset-card";
      b.innerHTML=`<i>${String(i+1).padStart(2,"0")}</i><b>${asset.short}</b><small>${asset.category}</small>`;
      b.addEventListener("click",()=>select(i));
      tray.appendChild(b);
    });

    let current=null, currentIndex=0, stateActive=false, exploded=false, wire=false, spinning=true;
    const clock=new THREE.Clock();

    function fitCamera(group, scale) {
      const box3=new THREE.Box3().setFromObject(group);
      const size=box3.getSize(new THREE.Vector3());
      const center=box3.getCenter(new THREE.Vector3());
      const span=Math.max(size.x,size.y,size.z);
      controls.target.copy(center);
      camera.position.set(center.x+span*1.35, center.y+span*.72, center.z+span*1.75);
      controls.minDistance=Math.max(2.3,span*.68);
      controls.maxDistance=Math.max(9,span*3);
      camera.near=.02; camera.far=150; camera.updateProjectionMatrix();
      controls.update();
    }
    function countGeometry(group) {
      let triangles=0,parts=0;
      group.traverse(o=>{
        if(!o.isMesh)return;
        parts++;
        const geom=o.geometry;
        triangles+=geom.index?geom.index.count/3:geom.attributes.position.count/3;
      });
      return { triangles:Math.round(triangles).toLocaleString(), parts };
    }
    function select(index) {
      currentIndex=(index+assets.length)%assets.length;
      if(current) scene.remove(current);
      stateActive=false; exploded=false; wire=false;
      document.body.classList.remove("danger");
      Object.values(M).forEach((material)=>{ if(material?.isMaterial) material.wireframe=false; });
      current=assets[currentIndex].make();
      current.rotation.y=-.25;
      scene.add(current);
      const info=assets[currentIndex], stats=countGeometry(current);
      document.querySelector("#serial").textContent=String(currentIndex+1).padStart(3,"0");
      document.querySelector("#assetNumber").textContent=String(currentIndex+1).padStart(2,"0");
      document.querySelector("#category").textContent=info.category;
      document.querySelector("#assetName").textContent=info.name;
      document.querySelector("#description").textContent=info.description;
      document.querySelector("#triangles").textContent=stats.triangles;
      document.querySelector("#parts").textContent=stats.parts;
      document.querySelector("#scale").textContent=info.scale;
      document.querySelector("#stateLabel").textContent="Idle";
      document.querySelector("#stateButton").classList.remove("active");
      document.querySelector("#explodeButton").classList.remove("active");
      document.querySelector("#wireButton").classList.remove("active");
      [...tray.children].forEach((b,i)=>b.classList.toggle("active",i===currentIndex));
      fitCamera(current,info.scale);
    }

    document.querySelector("#stateButton").addEventListener("click",()=>{
      stateActive=!stateActive;
      current?.userData.state?.update(stateActive,clock.elapsedTime);
      document.querySelector("#stateButton").classList.toggle("active",stateActive);
      document.querySelector("#stateLabel").textContent=stateActive?(current.userData.state?.label||"Active"):"Idle";
      document.body.classList.toggle("danger",stateActive&&[1,2,3,7,8,11].includes(currentIndex));
    });
    document.querySelector("#explodeButton").addEventListener("click",()=>{
      exploded=!exploded;
      document.querySelector("#explodeButton").classList.toggle("active",exploded);
      const meshes=[]; current?.traverse(o=>{if(o.isMesh)meshes.push(o);});
      meshes.forEach((m,i)=>{
        const h=m.userData.home||m.position;
        const dir=new THREE.Vector3((i%3)-1,((i*7)%5-2)*.35,((i*11)%3)-1).normalize();
        m.position.copy(h).addScaledVector(dir,exploded?.24:0);
      });
    });
    document.querySelector("#wireButton").addEventListener("click",()=>{
      wire=!wire;
      document.querySelector("#wireButton").classList.toggle("active",wire);
      current?.traverse(o=>{if(o.isMesh&&o.material&&!Array.isArray(o.material))o.material.wireframe=wire;});
    });
    document.querySelector("#spinButton").addEventListener("click",(e)=>{
      spinning=!spinning; e.currentTarget.classList.toggle("active",spinning);
    });
    document.querySelector("#exportButton").addEventListener("click",()=>{
      if(!current)return;
      const clone=current.clone(true);
      clone.rotation.set(0,0,0);
      clone.position.set(0,0,0);
      clone.traverse(o=>{if(o.isLight)o.parent?.remove(o);});
      new GLTFExporter().parse(clone,(result)=>{
        const blob=new Blob([result],{type:"model/gltf-binary"});
        const link=document.createElement("a");
        link.href=URL.createObjectURL(blob);
        link.download=`ucb_${assets[currentIndex].short.toLowerCase()}_psx.glb`;
        link.click();
        setTimeout(()=>URL.revokeObjectURL(link.href),1000);
      },(error)=>console.error(error),{binary:true,onlyVisible:false});
    });

    addEventListener("keydown",(e)=>{
      if(/^[1-9]$/.test(e.key))select(Number(e.key)-1);
      if(e.key==="0")select(9);
      if(e.key==="ArrowRight")select(currentIndex+1);
      if(e.key==="ArrowLeft")select(currentIndex-1);
      if(e.key.toLowerCase()==="e")document.querySelector("#stateButton").click();
    });
    addEventListener("resize",()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      const t=clock.getElapsedTime();
      if(current){
        if(spinning&&!controls._state)current.rotation.y+=.0022;
        if(stateActive)current.userData.state?.update(true,t);
      }
      key.intensity=4.1+.25*Math.sin(t*.75);
      controls.update();
      renderer.render(scene,camera);
    }
    select(0);
    animate();
  </script>
</body>
</html>
